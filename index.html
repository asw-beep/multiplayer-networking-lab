<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multiplayer Networking Lab — M4</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #1b1e27;
        --panel-2: #171a22;
        --line: #2c3244;
        --ink: #e6e8ee;
        --muted: #8b93a7;
        --accent: #4f8cff;
        --green: #5bd6a0;
        --gold: #f2c14e;
        --red: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 20px 16px 32px;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: center;
      }

      h1 span {
        color: var(--muted);
        font-weight: 400;
      }

      /* --- the arena and the lobby share one box --- */

      .stage {
        position: relative;
        width: min(800px, 100%);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 10px 40px rgb(0 0 0 / 0.45);
      }

      #lobby {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px 20px;
        border-radius: 10px;
        background: rgb(18 20 26 / 0.9);
        backdrop-filter: blur(3px);
        text-align: center;
      }

      #lobby[hidden] {
        display: none !important;
      }

      #lobby-heading {
        margin: 0;
        font-size: clamp(20px, 4.5vw, 28px);
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      #lobby-detail {
        margin: 0;
        max-width: 44ch;
        color: var(--muted);
        font-size: 14px;
      }

      /* --- player slots --- */

      #lobby-slots {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        width: 100%;
        max-width: 440px;
      }

      .slot {
        flex: 1 1 180px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        text-align: left;
      }

      .slot.empty {
        border-style: dashed;
        opacity: 0.55;
      }

      .slot.local {
        border-color: rgb(79 140 255 / 0.5);
      }

      .slot.remote {
        border-color: rgb(91 214 160 / 0.4);
      }

      .slot-name {
        font-weight: 600;
        font-size: 14px;
      }

      .slot.local .slot-name {
        color: var(--accent);
      }

      .slot.remote .slot-name {
        color: var(--green);
      }

      .slot-status {
        color: var(--muted);
        font: 12px ui-monospace, Consolas, monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .slot-status.ready {
        color: var(--green);
      }

      .slot-status.score {
        color: var(--gold);
        font-size: 13px;
        text-transform: none;
        letter-spacing: 0;
      }

      /* --- ready button --- */

      #lobby-ready {
        min-width: 190px;
        padding: 12px 26px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: rgb(79 140 255 / 0.16);
        color: var(--accent);
        font: 600 15px ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }

      #lobby-ready:hover:not(:disabled) {
        background: rgb(79 140 255 / 0.26);
      }

      #lobby-ready:disabled {
        border-color: var(--line);
        background: transparent;
        color: var(--muted);
        cursor: not-allowed;
      }

      #lobby-ready.is-ready {
        border-color: var(--green);
        background: rgb(91 214 160 / 0.16);
        color: var(--green);
      }

      #lobby-hint {
        margin: 0;
        max-width: 46ch;
        color: #5d6478;
        font-size: 12.5px;
      }

      .controls {
        margin: 0;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      kbd {
        padding: 1px 5px;
        border: 1px solid #394054;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #232839;
        font: inherit;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Multiplayer Networking Lab <span>— M4: fixed timestep &amp; snapshots</span></h1>

    <div class="stage">
      <!-- The canvas has a fixed internal resolution; CSS scales it to fit the
           screen, so the simulation always works in the same 800×600 units
           whether this is a desktop or a phone. -->
      <canvas id="game" width="800" height="600"></canvas>

      <section id="lobby" hidden>
        <h2 id="lobby-heading">Connecting…</h2>
        <p id="lobby-detail"></p>
        <div id="lobby-slots"></div>
        <button id="lobby-ready" type="button" disabled>Ready</button>
        <p id="lobby-hint"></p>
      </section>
    </div>

    <p class="controls">
      Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys.
    </p>

    <script type="module" src="./dist/client/main.js"></script>
  </body>
</html>
